[project]
name = "localcode-orchestrator"
version = "0.1.0"
description = "Provider-agnostic abstraction over Claude Code and OpenCode."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.2",
    "websockets>=13.1",
    "claude-agent-sdk>=0.2.152,<0.3.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented idiom is `Query(...)` as a parameter default — the
# call builds a field-info marker FastAPI's dependency system reads at
# collection time, not a real mutable-default hazard B008 exists to catch.
"backend/app/routes/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "-m 'not requires_cli'"
markers = [
    "requires_cli: needs a real vendor CLI (claude / codex) on PATH; excluded by default",
    # Registered here, ahead of its first use, so a suite that needs it can be
    # written without also editing this file — and so `-m "not slow"` is a
    # valid selector from the moment the first such test lands. Nothing in the
    # tree is marked `slow` yet; an unregistered marker is a warning, and the
    # suite runs under `-W error::UserWarning`.
    "slow: a long-running soak / endurance case; excluded with -m 'not slow'",
]
