[project]
name = "localcode-orchestrator"
version = "0.1.0"
description = "Provider-agnostic abstraction over Claude Code and Codex."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "websockets>=13.1",
    "claude-agent-sdk>=0.2.152,<0.3.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    # Test-only since the OpenCode provider (the sole runtime user) was
    # retired: starlette's TestClient needs it, the application does not.
    "httpx>=0.27.2",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
eval = [
    "swebench==5.0.2",
]

[project.scripts]
localcode = "backend.app.core.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented idiom is `Query(...)` as a parameter default — the
# call builds a field-info marker FastAPI's dependency system reads at
# collection time, not a real mutable-default hazard B008 exists to catch.
"backend/app/routes/*.py" = ["B008"]
# Test fixtures embed extension source as strings; line length is noise there.
"backend/tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "-m 'not requires_cli and not slow'"
markers = [
    "requires_cli: needs a real vendor CLI (claude / codex) on PATH; excluded by default",
    # Registered ahead of its first use by Task 12; claimed by Task 16's
    # `backend/tests/test_soak_long_session.py`, the only test that carries it.
    # Excluded from the default run above NOT for its cost (it runs in 1.5 s)
    # but because it produces a trend to read rather than a gate to pass: its
    # budgets are loose by design, so it belongs in a run someone is looking
    # at. `make soak` is that run — the whole suite plus this, under
    # `-W error::UserWarning` and a per-test wall clock.
    "slow: a long-running soak / endurance case; excluded with -m 'not slow'",
]
