name: release
# A pushed tag v* that matches crates/octet's version is checked, built on
# each platform's native runner, and its archives, with SHA-256 files, are
# attached to a GitHub release. A tag with a "-" (v0.2.0-rc1) is a
# pre-release. Re-running replaces the archives of an existing release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: The tag names the crate's version
        run: scripts/release-tag-check.sh "$TAG" crates/octet/Cargo.toml
  check:
    needs: version
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
      checks: write
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # The oldest supported runners, so the archives run on glibc 2.35
          # and later (Ubuntu 22.04, Debian 12).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      # rustup installs the toolchain that rust-toolchain.toml pins.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add "$TARGET"
      - run: cargo build --release --locked -p octet --target "$TARGET"
      - name: Pack
        run: |
          name="octet-$TAG-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/octet" README.md LICENSE-APACHE LICENSE-MIT CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: octet-${{ matrix.target }}
          path: octet-*.tar.gz*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: scripts/release-publish.sh "$TAG" dist
