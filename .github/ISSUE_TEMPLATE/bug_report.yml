name: Bug report
description: Something in Octet doesn't work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Journals and screenshots can contain source code, prompts and paths: remove anything you don't want to be public before you paste it.
        Found a security problem, such as exposed credentials or an approval answered without you? Please report it privately under **Security → Report a vulnerability** instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. octet --engine claude --cwd ~/project
        2. Type /model claude opus
        3. ...
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - claude
        - codex
        - demo
    validations:
      required: true
  - type: input
    id: octet-version
    attributes:
      label: Octet commit
      description: Output of `git rev-parse --short HEAD` in your checkout.
    validations:
      required: true
  - type: input
    id: vendor-version
    attributes:
      label: Vendor CLI version
      description: Output of `claude --version` or `codex --version`. Not needed for the demo.
  - type: input
    id: environment
    attributes:
      label: OS and terminal
      description: For example "macOS 26.4, Ghostty 1.3" or "Ubuntu 24.04, kitty, inside tmux 3.5 over mosh".
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journal excerpt or screenshot
      description: Optional. Remove private content first.
