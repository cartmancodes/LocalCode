# cargo-deny (https://embarkstudios.github.io/cargo-deny/), run in CI by
# .github/workflows/check.yml: licenses, bans and sources. Advisories are
# the audit job's.

[graph]
all-features = true

[licenses]
# Every licence in the dependency tree, as of this file; a new one fails
# the check until it is reviewed and added.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published (publish = false).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies have no version to pin.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
