[workspace]
members = ["crates/octet-proc", "crates/octet-testkit", "crates/octet-engine", "crates/octet-gate", "crates/octet-store", "crates/octet-core", "crates/octet-tui", "crates/octet"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cartmancodes/octet"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "io-util", "io-std", "fs", "net"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
missing_docs = "warn"

# The rust-engineer skill's rules (.claude/skills/rust-engineer), enforced.
[workspace.lints.clippy]
cast_possible_truncation = "warn"
needless_pass_by_ref_mut = "warn"
unused_async = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
needless_pass_by_value = "warn"
