[workspace]
members = ["crates/lc-proc", "crates/lc-testkit", "crates/lc-engine", "crates/lc-store", "crates/lc-core", "crates/lc-tui", "crates/localcode"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.98"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
