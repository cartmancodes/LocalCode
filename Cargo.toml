[workspace]
members = ["crates/octet-proc", "crates/octet-testkit", "crates/octet-engine", "crates/octet-store", "crates/octet-core", "crates/octet-tui", "crates/octet"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.98"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
